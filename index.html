<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neha Jatla — CS, AI &amp; Design @ Duke</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="work.css?v=17">
</head>
<body>

  <nav class="nav">
    <ul class="nav-links">
      <li><a href="index.html#work" id="nav-work">Work</a></li>
      <li><a href="playground.html">Playground</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div id="hero-lotus">
    <pre id="lattice-bg"></pre>

    <div id="hero">
      <div id="flower-stage">
        <pre id="sat-a"></pre>
        <pre id="sat-b"></pre>
        <div id="flower-cells"></div>
      </div>

      <h1 class="fade-up">hi, i'm <em>neha</em></h1>
      <div class="fade-up eyebrow">CS, AI &amp; Design @ Duke</div>

      <div id="cue">
        <span>Scroll</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 8l8 8 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- Interactive ASCII orbs — small clusters of shifting characters
         that scatter/brighten when the periwinkle cursor gets near.
         Populated by lotus-hero.js. -->
    <div class="ascii-orb" id="orb-1" style="top:9%; left:10%;"></div>
    <div class="ascii-orb" id="orb-2" style="top:8%; right:9%;"></div>
    <div class="ascii-orb" id="orb-3" style="top:38%; left:5%;"></div>
    <div class="ascii-orb" id="orb-4" style="top:36%; right:5%;"></div>
    <div class="ascii-orb" id="orb-5" style="bottom:9%; left:12%;"></div>
    <div class="ascii-orb" id="orb-6" style="bottom:8%; right:10%;"></div>

    <!-- Dithered ASCII gradient bridging the near-black hero into the
         cream Work section below, instead of a hard color cut. -->
    <div id="hero-fade"></div>

    <div id="cursor"></div>
  </div>

  <!-- ================================================================
       WORK — two-column staggered card grid, rendered by paintstore.js
       from the PROJECTS data array (see that file to add/edit projects).
       ================================================================ -->
  <section id="work">
    <div class="work-intro">
      <h2 class="work-heading">Selected Work</h2>
    </div>

    <div class="card-grid" id="card-grid"></div>
  </section>

  <!-- ================================================================
       CASE STUDY OVERLAY — one shared shell, populated per-project by
       paintstore.js when a swatch is opened.
       ================================================================ -->
  <div class="case-overlay" id="case-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="case-topbar">
      <button class="case-back" id="case-back">← Back to work</button>
      <button class="case-close" id="case-close" aria-label="Close case study">✕</button>
    </div>

    <div class="case-hero" id="case-hero">
      <p class="case-hero-label" id="case-hero-label"></p>
      <h2 class="case-hero-title" id="case-hero-title"></h2>
      <p class="case-hero-meta" id="case-hero-meta"></p>
    </div>

    <div class="case-body" id="case-body"></div>
  </div>

  <script src="paintstore.js"></script>
  <script src="lotus-hero.js?v=8"></script>
</body>
</html>
