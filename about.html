<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha — About</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
    <link rel="stylesheet" href="styles.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="nav-container">
        <div class="nav-links">
            <a href="index.html#work">Work</a>
            <a href="playground.html">Playground</a>
            <a href="about.html" class="active">About</a>
        </div>
    </nav>

    <div id="floating-ascii" aria-hidden="true"></div>

    <main class="under-construction">
        <p class="uc-eyebrow">Under construction</p>
        <h1 class="uc-title">check back later.</h1>
    </main>

    <div id="cursor"></div>

    <script src="script.js"></script>
    <script>
      // Custom periwinkle-dot cursor — native arrow hidden site-wide via
      // CSS (see styles.css), matching index.html / playground.html.
      (function () {
        const cursorEl = document.getElementById('cursor');
        if (!cursorEl) return;

        // Carries the color the cursor was left in on the homepage hero
        // across the rest of the visit (see index.html, the only page
        // that ever writes this key).
        const savedColor = localStorage.getItem('siteCursorColor');
        const baseColor = savedColor || getComputedStyle(cursorEl).backgroundColor;
        if (savedColor) cursorEl.style.background = savedColor;

        // Hand-picked pairings (not a computed complement) — each hero
        // palette color hovering the nav gets the word set in that same
        // color, on a rectangle in its specific paired color: dark blue
        // <-> coral pink, yellow -> dark blue, medium pink <-> lilac
        // purple, cyan <-> deeper orangey-pink/red.
        const HOVER_PAIRS = {
          '#4B8AFF': '#FD9191',
          '#FD9191': '#4B8AFF',
          '#FFE99B': '#4B8AFF',
          '#FF178B': '#EB95FF',
          '#EB95FF': '#FF178B',
          '#6AEEFF': '#FF4B51',
          '#FF4B51': '#6AEEFF'
        };
        function rgbToHex(rgb) {
          const m = rgb.match(/\d+/g);
          if (!m) return '#6574fc';
          return '#' + m.slice(0, 3).map((v) => (+v).toString(16).padStart(2, '0')).join('');
        }
        function hoverBg(hex) {
          return HOVER_PAIRS[hex.toUpperCase()] || '#4B8AFF';
        }

        // The highlight rectangle lives inside each link (a span inserted
        // before its text), not on the shared #cursor dot — #cursor sits
        // at z-index:9999 site-wide, and .nav-container has
        // backdrop-filter:blur(14px); putting the rectangle behind nav to
        // let the text show through ran it straight through that blur and
        // turned a crisp rectangle into a soft glow. A span painted
        // inside the link never touches the blur, and — since it's
        // absolutely positioned with z-index:-1 while the link's own text
        // is plain in-flow inline content, which always paints above
        // negative-z-index positioned siblings — the text sits on top of
        // it automatically.
        document.querySelectorAll('.nav-links a').forEach((link) => {
          const hl = document.createElement('span');
          hl.className = 'nav-hl';
          link.prepend(hl);
        });

        // Checked via real pointer position on move, not mouseenter/
        // mouseleave — those fire spuriously when the page scrolls.
        let lastLink = null;
        document.addEventListener('pointermove', (e) => {
          const hoverTarget = document.elementFromPoint(e.clientX, e.clientY);
          const navLink = hoverTarget && hoverTarget.closest('.nav-links a');

          if (navLink !== lastLink) {
            if (lastLink) {
              lastLink.classList.remove('nav-hover');
              lastLink.style.color = '';
            }
            if (navLink) {
              const current = localStorage.getItem('siteCursorColor') || baseColor;
              const currentHex = current.startsWith('#') ? current : rgbToHex(current);
              navLink.querySelector('.nav-hl').style.background = hoverBg(currentHex);
              navLink.classList.add('nav-hover');
              navLink.style.color = currentHex;
            }
            lastLink = navLink;
          }

          cursorEl.style.transform = 'translate3d(' + (e.clientX - 10) + 'px, ' + (e.clientY - 10) + 'px, 0)';
          cursorEl.style.scale = (!navLink && hoverTarget && hoverTarget.closest('a, button')) ? '1.7' : '1';
        }, { passive: true });
      })();
    </script>
    <script>
      // Floating ASCII characters, aurora-colored — same drifting-particle
      // idea as the homepage hero's orbs, scaled up to fill this whole page
      // as ambient background texture for the placeholder.
      (function () {
        const container = document.getElementById('floating-ascii');
        if (!container) return;

        const CHARS = ['·', '∘', '+', 'x', '~', '*', '°', '¦', '✦'];
        const AURORA = ['#3FB8A8', '#8F94FB', '#D484DB', '#F5792C', '#5AB4E0'];
        const COUNT = 34;

        function hash(x, y) {
          const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
          return s - Math.floor(s);
        }
        function hexToRgb(hex) {
          const n = parseInt(hex.slice(1), 16);
          return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }
        function lerpColor(a, b, t) {
          const c1 = hexToRgb(a), c2 = hexToRgb(b);
          return `rgb(${Math.round(c1.r + (c2.r - c1.r) * t)},${Math.round(c1.g + (c2.g - c1.g) * t)},${Math.round(c1.b + (c2.b - c1.b) * t)})`;
        }
        function auroraColor(t) {
          t -= Math.floor(t);
          const seg = t * AURORA.length;
          const i = Math.floor(seg) % AURORA.length;
          const j = (i + 1) % AURORA.length;
          return lerpColor(AURORA[i], AURORA[j], seg - Math.floor(seg));
        }

        const particles = [];
        for (let i = 0; i < COUNT; i++) {
          const span = document.createElement('span');
          span.textContent = CHARS[Math.floor(hash(i, 1) * CHARS.length)];
          span.style.fontSize = (10 + hash(i, 2) * 10) + 'px';
          container.appendChild(span);
          particles.push({
            span,
            baseX: hash(i, 3) * 100,
            baseY: hash(i, 4) * 100,
            ax: 30 + hash(i, 5) * 70,
            ay: 25 + hash(i, 6) * 60,
            fx: 0.0001 + hash(i, 7) * 0.00025,
            fy: 0.00012 + hash(i, 8) * 0.00022,
            phx: hash(i, 9) * Math.PI * 2,
            phy: hash(i, 10) * Math.PI * 2,
            colorPhase: hash(i, 11)
          });
        }

        function frame(now) {
          requestAnimationFrame(frame);
          particles.forEach((p) => {
            const dx = Math.sin(now * p.fx + p.phx) * p.ax;
            const dy = Math.cos(now * p.fy + p.phy) * p.ay;
            const color = auroraColor(now * 0.00008 + p.colorPhase);
            p.span.style.left = p.baseX + 'vw';
            p.span.style.top = p.baseY + 'vh';
            p.span.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
            p.span.style.color = color;
            p.span.style.textShadow = `0 0 6px ${color}`;
            p.span.style.opacity = (0.35 + Math.sin(now * 0.0005 + p.colorPhase * 10) * 0.25).toFixed(2);
          });
        }
        requestAnimationFrame(frame);
      })();
    </script>
</body>
</html>
